# OTP_helper.conf

# Path to hotp/totp generation script.  The script
# take script.sh SECRET COUNTER and will return
# the OTP on stdout.
OTP_PROG=./hotp.sh

# Secrets file.
# Format:
#	USER:SECRET:COUNTER
#
# Where:
#	USER request in Subject
#	SECRET is Base32 secret.
#	COUNTER: starting at 1
#	
SECRETS_FILE="./secrets.file"

